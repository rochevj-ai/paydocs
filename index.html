<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PayDocs</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F8F7F4;--sur:#fff;--sur2:#F3F2EE;--sur3:#ECEAE4;
  --bdr:#E2E0D8;--bdr2:#D0CEC5;
  --tx:#1A1917;--tx2:#6B6860;--tx3:#9B9890;
  --blue:#185FA5;--blt:#E6F1FB;--bmid:#378ADD;--bdk:#0C447C;
  --tlt:#E1F5EE;--tmid:#1D9E75;--tdk:#0F6E56;
  --alt:#FAEEDA;--amid:#EF9F27;--adk:#854F0B;
  --rlt:#FCEBEB;--rmid:#E24B4A;--rdk:#A32D2D;
  --glt:#EAF3DE;--gmid:#639922;--gdk:#3B6D11;
  --shadow:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.04);
  --shadow2:0 4px 16px rgba(0,0,0,.09),0 2px 4px rgba(0,0,0,.05);
  --r:8px;--rl:12px;--rxl:16px;
  --font:'Inter',system-ui,sans-serif;
  --mono:'JetBrains Mono',monospace;
}
html,body{height:100%;font-family:var(--font);font-size:14px;color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased}
.shell{display:flex;height:100vh;overflow:hidden}
/* sidebar */
.sb{width:210px;flex-shrink:0;background:var(--sur);border-right:1px solid var(--bdr);display:flex;flex-direction:column}
.logo{padding:18px 16px 14px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:10px}
.logo-ic{width:32px;height:32px;border-radius:10px;background:var(--blt);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.logo-tx{font-size:14px;font-weight:600}.logo-sub{font-size:11px;color:var(--tx2)}
.nav{flex:1;padding:8px 0;overflow-y:auto}
.nav-sec{padding:10px 16px 4px;font-size:10px;font-weight:600;color:var(--tx3);letter-spacing:1px;text-transform:uppercase}
.nav-it{display:flex;align-items:center;gap:9px;padding:8px 16px;font-size:13px;color:var(--tx2);cursor:pointer;border-left:2.5px solid transparent;transition:all .15s;user-select:none}
.nav-it:hover{color:var(--tx);background:var(--sur2)}
.nav-it.on{color:var(--blue);background:var(--blt);border-left-color:var(--blue);font-weight:500}
.nav-it i{font-size:16px;flex-shrink:0}
.nc{margin-left:auto;background:var(--blt);color:var(--bdk);font-size:10px;font-weight:600;padding:1px 7px;border-radius:20px}
.nav-it.on .nc{background:rgba(24,95,165,.18)}
.usr{padding:12px 16px;border-top:1px solid var(--bdr);display:flex;align-items:center;gap:10px;flex-shrink:0}
.av{width:30px;height:30px;border-radius:50%;background:var(--blt);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
/* main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.topbar{display:flex;align-items:center;gap:12px;padding:13px 24px;background:var(--sur);border-bottom:1px solid var(--bdr);flex-shrink:0}
.topbar-title{font-size:17px;font-weight:600;flex:1}
.content{flex:1;overflow-y:auto;padding:22px 24px}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;font-size:13px;font-weight:500;border:1px solid var(--bdr2);border-radius:var(--r);background:var(--sur);color:var(--tx);cursor:pointer;transition:all .15s;font-family:var(--font);line-height:1;white-space:nowrap}
.btn:hover{background:var(--sur2)}.btn:active{transform:scale(.98)}
.btn.pr{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.pr:hover{background:var(--bdk)}
.btn.gh{border-color:transparent;background:transparent;padding:5px 7px}.btn.gh:hover{background:var(--sur2)}
.btn.sm{padding:5px 10px;font-size:12px}.btn.xs{padding:3px 8px;font-size:11px}
.btn.ok{background:var(--glt);color:var(--gdk);border-color:#C0DD97}
.btn.del{background:var(--rlt);color:var(--rdk);border-color:#F7C1C1}
/* metrics */
.mrow{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.mc{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--rl);padding:16px;box-shadow:var(--shadow)}
.mc-ic{font-size:22px;margin-bottom:8px}
.mc.bl .mc-ic{color:var(--blue)}.mc.gr .mc-ic{color:var(--gdk)}.mc.am .mc-ic{color:var(--adk)}.mc.rd .mc-ic{color:var(--rdk)}
.mc-lb{font-size:11px;font-weight:500;color:var(--tx2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
.mc-vl{font-size:22px;font-weight:600;line-height:1.2}.mc-sb{font-size:11px;color:var(--tx3);margin-top:3px}
/* toolbar */
.tb{display:flex;gap:8px;margin-bottom:18px;align-items:center;flex-wrap:wrap}
.srw{position:relative;flex:1;min-width:180px}
.srw i{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--tx2);font-size:15px;pointer-events:none}
.srw input{padding-left:32px}
input,select,textarea{width:100%;padding:8px 11px;font-size:13px;font-family:var(--font);border:1px solid var(--bdr2);border-radius:var(--r);background:var(--sur);color:var(--tx);outline:none;transition:border-color .15s,box-shadow .15s;-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--bmid);box-shadow:0 0 0 3px rgba(55,138,221,.12)}
select{background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%23888780' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 10px center;padding-right:28px;cursor:pointer}
textarea{resize:vertical;line-height:1.5}
.tb select,.tb input[type=text]{height:36px;width:auto;min-width:130px}
/* pay cards */
.plist{display:flex;flex-direction:column;gap:12px}
.pc{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--rl);padding:16px 18px;box-shadow:var(--shadow);transition:border-color .15s;position:relative;overflow:hidden}
.pc::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.pc:hover{border-color:var(--bdr2)}
.pc.s-paid::before{background:var(--gmid)}.pc.s-used::before{background:var(--bmid)}
.pc.s-draft::before{background:#aaa}.pc.s-cancelled{opacity:.6}
.pc-top{display:flex;align-items:flex-start;gap:14px;margin-bottom:12px}
.pc-inf{flex:1;min-width:0}
.pc-nm{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}
.pc-mt{font-size:12px;color:var(--tx2);display:flex;flex-wrap:wrap;gap:0 14px}
.pc-mt span{display:inline-flex;align-items:center;gap:4px}
.pc-mt i{font-size:12px}
.pc-amt{font-size:20px;font-weight:600;text-align:right;white-space:nowrap}
.pc-bnk{font-size:12px;color:var(--tx2);text-align:right;margin-top:2px}
.purp{background:var(--sur2);border:1px solid var(--bdr);border-radius:var(--r);padding:10px 14px;margin-bottom:12px}
.purp-lb{font-size:10px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:4px}
.purp-tx{font-size:13px;line-height:1.5}
.pac{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sep{width:1px;height:16px;background:var(--bdr);margin:0 2px}
/* limit */
.limw{margin-bottom:12px}
.limb{height:5px;border-radius:3px;background:var(--sur3);overflow:hidden}
.limf{height:100%;border-radius:3px}
.limm{display:flex;justify-content:space-between;font-size:11px;color:var(--tx2);margin-top:3px}
/* badges */
.bdg{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;line-height:1.4}
.bdg.draft{background:#ECEAE4;color:#5F5E5A}
.bdg.used{background:var(--blt);color:var(--bdk)}
.bdg.paid{background:var(--glt);color:var(--gdk)}
.bdg.cancelled{background:var(--rlt);color:var(--rdk)}
.bdg.vrf{background:var(--tlt);color:var(--tdk)}
.bdg.uvrf{background:var(--alt);color:var(--adk)}
/* alerts */
.al{padding:10px 14px;border-radius:var(--r);font-size:13px;margin-bottom:12px;display:flex;gap:10px;align-items:flex-start;line-height:1.5}
.al i{font-size:16px;flex-shrink:0;margin-top:1px}
.al.warn{background:var(--alt);border:1px solid #FAC775;color:#5C3507}
.al.err{background:var(--rlt);border:1px solid #F7C1C1;color:#6B1A1A}
/* form */
.fw{max-width:620px}
.fcard{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--rl);padding:22px;margin-bottom:16px;box-shadow:var(--shadow)}
.fct{font-size:11px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.8px;margin-bottom:18px;display:flex;align-items:center;gap:8px}
.fct i{font-size:15px}
.fg{display:flex;flex-direction:column;gap:6px}
.fg label{font-size:12px;font-weight:500;color:var(--tx2)}
.fg .hint{font-size:11px;color:var(--tx3)}
.fg .ok{font-size:11px;color:var(--gdk);font-weight:500}
.fg .er{font-size:11px;color:var(--rdk);font-weight:500}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.full{grid-column:1/-1}
.irow{display:flex;gap:8px}.irow input{flex:1}
.prev{background:var(--blt);border:1px solid #B5D4F4;border-radius:var(--r);padding:11px 14px;font-size:13px;color:var(--bdk);margin-top:8px;line-height:1.5}
/* counterparties */
.cpgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cpcard{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--rl);padding:16px;box-shadow:var(--shadow);transition:border-color .15s}
.cpcard:hover{border-color:var(--bdr2)}
.cph{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.cpav{width:38px;height:38px;border-radius:10px;background:var(--blt);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0}
.cpnm{font-size:14px;font-weight:600;margin-bottom:2px}
.cpid{font-size:12px;color:var(--tx2);font-family:var(--mono)}
.cprow{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--bdr);font-size:12px}
.cprow:last-of-type{border-bottom:none}
.cprl{color:var(--tx2)}.cprv{font-weight:500;font-family:var(--mono);font-size:11px}
.cpac{display:flex;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--bdr);flex-wrap:wrap}
/* dashboard */
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.dc{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--rl);padding:18px;box-shadow:var(--shadow)}
.dc.full{grid-column:1/-1}
.dct{font-size:12px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.7px;margin-bottom:16px;display:flex;align-items:center;gap:7px}
.dct i{font-size:15px}
.br{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.brl{font-size:12px;width:120px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brt{flex:1;height:7px;background:var(--sur3);border-radius:4px;overflow:hidden}
.brf{height:100%;border-radius:4px}
.brv{font-size:12px;font-weight:500;width:90px;text-align:right;flex-shrink:0}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.si{background:var(--sur2);border-radius:var(--r);padding:12px;text-align:center}
.sil{font-size:11px;color:var(--tx2);margin-bottom:5px}
.siv{font-size:20px;font-weight:600}
.sis{font-size:11px;color:var(--tx3);margin-top:3px}
/* audit */
.aulist{display:flex;flex-direction:column}
.auit{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--bdr)}
.auit:last-child{border-bottom:none}
.audot{width:8px;height:8px;border-radius:50%;background:#B5D4F4;flex-shrink:0;margin-top:5px}
.auts{font-size:11px;color:var(--tx2);white-space:nowrap;flex-shrink:0;width:110px;font-family:var(--mono)}
.auac{font-size:13px;font-weight:500;margin-bottom:2px}
.aude{font-size:12px;color:var(--tx2)}
/* export */
.exgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.excard{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--rl);padding:22px 18px;text-align:center;cursor:pointer;transition:all .2s;box-shadow:var(--shadow)}
.excard:hover{border-color:var(--bmid);box-shadow:var(--shadow2);transform:translateY(-2px)}
.excard i{font-size:32px;margin-bottom:12px;display:block}
.excard.xl i{color:var(--gdk)}.excard.csv i{color:var(--tdk)}.excard.pr i{color:var(--blue)}
.exct{font-size:14px;font-weight:600;margin-bottom:4px}.excs{font-size:12px;color:var(--tx2)}
/* modal */
.mov{position:fixed;inset:0;background:rgba(26,25,23,.4);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px}
.mo{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--rxl);width:100%;max-width:520px;box-shadow:var(--shadow2);animation:fu .18s ease}
@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.moh{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--bdr)}
.moht{font-size:15px;font-weight:600}
.mob{padding:20px}
.mof{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--bdr);background:var(--sur2);border-radius:0 0 var(--rxl) var(--rxl)}
/* toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1A1917;color:#F8F7F4;padding:10px 20px;border-radius:30px;font-size:13px;font-weight:500;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap;z-index:1000;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.toast.show{opacity:1}
/* empty */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:70px;color:var(--tx2);text-align:center}
.empty i{font-size:44px;margin-bottom:12px;opacity:.3}
@media print{.sb,.topbar,.pac,.tb,.mrow,.btn{display:none!important}.shell{height:auto;display:block}.main{display:block;overflow:visible}.content{overflow:visible;padding:0}.pc{break-inside:avoid;box-shadow:none}}
</style>
</head>
<body>
<div class="shell" id="app"></div>
<div class="toast" id="toast"></div>
<script>
var DATA = {
  payments: [],
  counterparties: [
    {id:1, name:"ФОП Петренко О.В.", edrpou:"3145678901", iban:"UA213223130000026007233566001", bank:"ПриватБанк", serviceType:"адміністративні послуги", template:"Оплата {тип} згідно рахунку {номер} від {дата}", active:true, monthLimit:50000},
    {id:2, name:'ТОВ "Консалт Груп"', edrpou:"38901234", iban:"UA903052992990004149123456789", bank:"ПУМБ", serviceType:"консультаційні послуги", template:"Оплата {тип} згідно рахунку {номер} від {дата}", active:true, monthLimit:100000},
    {id:3, name:"ФОП Сидоренко А.Л.", edrpou:"2987654321", iban:"UA623515330000026008055819529", bank:"Ощадбанк", serviceType:"рекламні послуги", template:"Оплата {тип} згідно рахунку {номер} від {дата}", active:true, monthLimit:30000}
  ],
  audit: [],
  user: {name:"Користувач", role:"owner", initials:"КР"},
  nextId: 1
};

var SVC = ["адміністративні послуги","консультаційні послуги","рекламні послуги","інформаційно-консультаційні послуги","організаційний супровід"];
var STAT = {draft:"Чернетка", used:"Використано", paid:"Оплачено", cancelled:"Скасовано"};
var ROLE = {owner:"Власник", accountant:"Бухгалтер", manager:"Менеджер"};

var S = {page:"payments", search:"", filters:{cp:"",month:"",svc:"",status:""}, form:{fmt:"ДДММРР/XXX",status:"draft"}, editId:null, modal:null, dupOk:false};

function pad(n){return String(n).padStart(2,"0");}
function fmtN(n){return Number(n).toLocaleString("uk-UA");}
function fmtD(s){if(!s)return"";var p=s.split("-");return p[2]+"."+p[1]+"."+p[0];}
function toDS(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function today(){return toDS(new Date());}
function isWE(s){var d=new Date(s);return d.getDay()===0||d.getDay()===6;}
function prevWD(s){var d=new Date(s);do{d.setDate(d.getDate()-1);}while(isWE(toDS(d)));return toDS(d);}
function nextWD(s){var d=new Date(s);do{d.setDate(d.getDate()+1);}while(isWE(toDS(d)));return toDS(d);}
function validIBAN(s){return /^UA\d{27}$/.test((s||"").replace(/\s/g,""));}
function initials(name){return name.split(/\s+/).filter(Boolean).slice(0,2).map(function(w){return w[0];}).join("").toUpperCase();}

function genNum(fmt, date){
  var d=new Date(date);
  var dd=pad(d.getDate()),mm=pad(d.getMonth()+1),yy=String(d.getFullYear()).slice(2);
  var xxx, tries=0, taken;
  do{
    xxx=String(Math.floor(Math.random()*900)+100);
    tries++;
    taken=DATA.payments.some(function(p){return p.invoiceNumber.endsWith("/"+xxx)||p.invoiceNumber.endsWith("-"+xxx);});
  }while(tries<100 && taken);
  if(fmt==="ДДММРР/XXX") return dd+mm+yy+"/"+xxx;
  if(fmt==="№ДД/ММ-РР") return "№"+dd+"/"+mm+"-"+yy;
  return yy+mm+dd+"-"+xxx;
}

function buildPurpose(svc, num, date, tmpl){
  if(tmpl && tmpl.indexOf("{номер}")>=0){
    return tmpl.replace("{тип}",svc).replace("{номер}",num).replace("{дата}",fmtD(date));
  }
  return "Оплата "+svc+" згідно рахунку "+num+" від "+fmtD(date);
}

function monthSpend(cpName, month){
  return DATA.payments.filter(function(p){
    return p.counterparty===cpName && p.status!=="cancelled" && (p.invoiceDate||"").indexOf(month)===0;
  }).reduce(function(s,p){return s+Number(p.amount);},0);
}

function checkDups(form){
  var w=[];
  if(DATA.payments.some(function(p){return p.invoiceNumber===form.invoiceNumber && p.id!==form.id;})) w.push("Такий номер рахунку вже існує в базі");
  if(DATA.payments.some(function(p){return p.counterparty===form.counterparty && p.invoiceDate===form.invoiceDate && p.id!==form.id;})) w.push("Ця дата вже використана для цього контрагента");
  if(DATA.payments.some(function(p){return p.invoiceDate===form.invoiceDate && Number(p.amount)===Number(form.amount) && p.id!==form.id;})) w.push("Така сума вже використана в цей день");
  if(DATA.payments.some(function(p){return p.purpose===form.purpose && p.id!==form.id;})) w.push("Призначення платежу повністю дублюється");
  return w;
}

/* ===================== LOCALSTORAGE ===================== */
var LS_KEY = "paydocs_data_v1";
var _saveStatus = "";

var DEFAULT_CP = [
  {id:1, name:"ФОП Петренко О.В.", edrpou:"3145678901", iban:"UA213223130000026007233566001", bank:"ПриватБанк", serviceType:"адміністративні послуги", template:"Оплата {тип} згідно рахунку {номер} від {дата}", active:true, monthLimit:50000},
  {id:2, name:'ТОВ "Консалт Груп"', edrpou:"38901234", iban:"UA903052992990004149123456789", bank:"ПУМБ", serviceType:"консультаційні послуги", template:"Оплата {тип} згідно рахунку {номер} від {дата}", active:true, monthLimit:100000},
  {id:3, name:"ФОП Сидоренко А.Л.", edrpou:"2987654321", iban:"UA623515330000026008055819529", bank:"Ощадбанк", serviceType:"рекламні послуги", template:"Оплата {тип} згідно рахунку {номер} від {дата}", active:true, monthLimit:30000}
];

function saveData(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify({
      payments:DATA.payments, counterparties:DATA.counterparties,
      audit:DATA.audit, user:DATA.user, nextId:DATA.nextId
    }));
    _saveStatus="ok"; updateSaveIndicator();
  }catch(e){ _saveStatus="err"; updateSaveIndicator(); }
}

function loadData(){
  try{
    var raw=localStorage.getItem(LS_KEY);
    if(!raw) return false;
    var p=JSON.parse(raw);
    if(!p.payments||!p.counterparties) return false;
    DATA.payments=p.payments; DATA.counterparties=p.counterparties;
    DATA.audit=p.audit||[]; DATA.user=p.user||DATA.user; DATA.nextId=p.nextId||1;
    _saveStatus="loaded"; return true;
  }catch(e){ _saveStatus="err"; return false; }
}

function resetData(){
  if(!confirm("Очистити всі локальні дані? Всі платежі будуть видалені!")) return;
  localStorage.removeItem(LS_KEY);
  DATA.payments=[]; DATA.audit=[]; DATA.nextId=1;
  DATA.counterparties=DEFAULT_CP.map(function(c){return Object.assign({},c);});
  _saveStatus=""; render(); toast("Дані очищено");
}

function exportBackup(){
  var d=new Date();
  var ds=d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  var json=JSON.stringify({payments:DATA.payments,counterparties:DATA.counterparties,audit:DATA.audit,user:DATA.user,nextId:DATA.nextId},null,2);
  var a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([json],{type:"application/json"}));
  a.download="paydocs-backup-"+ds+".json"; a.click(); toast("Резервну копію збережено");
}

function importBackup(file){
  if(!file) return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var p=JSON.parse(e.target.result);
      if(!p.payments||!p.counterparties||!Array.isArray(p.payments)){toast("Невірний формат файлу");return;}
      DATA.payments=p.payments; DATA.counterparties=p.counterparties;
      DATA.audit=p.audit||[]; DATA.user=p.user||DATA.user; DATA.nextId=p.nextId||1;
      saveData(); render(); toast("Імпорт: "+DATA.payments.length+" платежів");
    }catch(ex){ toast("Помилка читання файлу"); }
  };
  reader.readAsText(file);
}

function updateSaveIndicator(){
  var ind=document.getElementById("save-ind");
  if(!ind) return;
  if(_saveStatus==="ok"){ind.textContent="✓ Збережено";ind.style.color="var(--gdk)";}
  else if(_saveStatus==="err"){ind.textContent="✗ Помилка збереження";ind.style.color="var(--rdk)";}
  else if(_saveStatus==="loaded"){ind.textContent="↓ Завантажено з браузера";ind.style.color="var(--blue)";}
  else{ind.textContent="";}
}

function addAudit(action, detail){
  DATA.audit.unshift({id:DATA.audit.length+1, ts:new Date().toISOString().replace("T"," ").slice(0,16), user:DATA.user.name, action:action, detail:detail});
  saveData();
}

var _tt=null;
function toast(msg){
  var t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(_tt); _tt=setTimeout(function(){t.classList.remove("show");},2200);
}

function copyTxt(txt){
  try{navigator.clipboard.writeText(txt);}catch(e){}
  toast("Скопійовано");
}

function el(tag,cls,html){
  var e=document.createElement(tag);
  if(cls) e.className=cls;
  if(html) e.innerHTML=html;
  return e;
}

/* ===================== RENDER ===================== */
function render(){
  var app=document.getElementById("app");
  app.innerHTML="";
  // remove old modals
  var old=document.querySelector(".mov");
  if(old) old.remove();

  var sb=makeSidebar();
  app.appendChild(sb);

  var main=el("div","main");
  main.appendChild(makeTopbar());
  var content=el("div","content");

  if(S.page==="payments") pPayments(content);
  else if(S.page==="create"||S.page==="edit") pForm(content);
  else if(S.page==="counterparties") pCP(content);
  else if(S.page==="dashboard") pDash(content);
  else if(S.page==="audit") pAudit(content);
  else if(S.page==="export") pExport(content);

  main.appendChild(content);
  app.appendChild(main);

  if(S.modal) renderModal();
}

/* ===================== PAYMENTS ===================== */
function pPayments(el_){
  var pays=DATA.payments.slice();
  var f=S.filters;
  if(S.search){var q=S.search.toLowerCase();pays=pays.filter(function(p){return p.invoiceNumber.toLowerCase().indexOf(q)>=0||p.counterparty.toLowerCase().indexOf(q)>=0||String(p.amount).indexOf(q)>=0||p.invoiceDate.indexOf(q)>=0;});}
  if(f.cp) pays=pays.filter(function(p){return p.counterparty===f.cp;});
  if(f.month) pays=pays.filter(function(p){return p.invoiceDate.indexOf(f.month)===0;});
  if(f.svc) pays=pays.filter(function(p){return p.serviceType===f.svc;});
  if(f.status) pays=pays.filter(function(p){return p.status===f.status;});
  pays.sort(function(a,b){return b.invoiceDate.localeCompare(a.invoiceDate);});

  var thisM=today().slice(0,7);
  var totalAll=DATA.payments.filter(function(p){return p.status!=="cancelled";}).reduce(function(s,p){return s+Number(p.amount);},0);
  var monthAmt=DATA.payments.filter(function(p){return p.status!=="cancelled"&&p.invoiceDate.indexOf(thisM)===0;}).reduce(function(s,p){return s+Number(p.amount);},0);
  var draftCnt=DATA.payments.filter(function(p){return p.status==="draft";}).length;
  var unchk=DATA.payments.filter(function(p){return !p.docsChecked&&p.status!=="cancelled";}).length;

  var mg=el("div","mrow");
  [{cls:"bl",icon:"ti-file-invoice",label:"Всього платежів",val:DATA.payments.length,sub:draftCnt+" чернеток"},
   {cls:"gr",icon:"ti-cash",label:"Поточний місяць",val:fmtN(monthAmt)+" грн",sub:thisM},
   {cls:"am",icon:"ti-building-bank",label:"Загальна сума",val:fmtN(totalAll)+" грн",sub:"активні"},
   {cls:"rd",icon:"ti-alert-triangle",label:"Без перевірки",val:unchk,sub:"потребують уваги"}
  ].forEach(function(m){
    var d=el("div","mc "+m.cls);
    d.innerHTML='<div class="mc-ic"><i class="ti '+m.icon+'"></i></div><div class="mc-lb">'+m.label+"</div><div class=\"mc-vl\">"+m.val+"</div><div class=\"mc-sb\">"+m.sub+"</div>";
    mg.appendChild(d);
  });
  el_.appendChild(mg);

  var months=[];
  DATA.payments.forEach(function(p){var mo=p.invoiceDate.slice(0,7);if(months.indexOf(mo)<0)months.push(mo);});
  months.sort().reverse();

  var toolbar=el("div","tb");
  var sw=el("div","srw");
  sw.innerHTML='<i class="ti ti-search"></i>';
  var sinp=el("input");sinp.type="text";sinp.placeholder="Пошук: номер, контрагент, сума...";sinp.value=S.search||"";
  sinp.addEventListener("input",function(){S.search=this.value;render();});
  sw.appendChild(sinp);toolbar.appendChild(sw);

  var cpSel=el("select");cpSel.innerHTML='<option value="">Всі контрагенти</option>'+DATA.counterparties.map(function(c){return '<option value="'+c.name+'"'+(f.cp===c.name?" selected":"")+">"+c.name+"</option>";}).join("");
  cpSel.addEventListener("change",function(){f.cp=this.value;render();});toolbar.appendChild(cpSel);

  var mSel=el("select");mSel.innerHTML='<option value="">Всі місяці</option>'+months.map(function(m){return '<option value="'+m+'"'+(f.month===m?" selected":"")+">"+m+"</option>";}).join("");
  mSel.addEventListener("change",function(){f.month=this.value;render();});toolbar.appendChild(mSel);

  var sSel=el("select");sSel.innerHTML='<option value="">Всі статуси</option>'+Object.keys(STAT).map(function(k){return '<option value="'+k+'"'+(f.status===k?" selected":"")+">"+STAT[k]+"</option>";}).join("");
  sSel.addEventListener("change",function(){f.status=this.value;render();});toolbar.appendChild(sSel);
  el_.appendChild(toolbar);

  if(!pays.length){var em=el("div","empty");em.innerHTML='<i class="ti ti-inbox"></i><p>Платежів не знайдено</p>';el_.appendChild(em);return;}

  var list=el("div","plist");
  pays.forEach(function(p){
    var cp=DATA.counterparties.filter(function(c){return c.name===p.counterparty;})[0];
    var spent=cp?monthSpend(p.counterparty,p.invoiceDate.slice(0,7)):0;
    var lim=cp?cp.monthLimit:null;
    var pct=lim?Math.min(100,Math.round(spent/lim*100)):0;
    var lc=pct>90?"#E24B4A":pct>70?"#EF9F27":"#639922";

    var rgt=el("div");rgt.innerHTML='<div class="pc-amt">'+fmtN(p.amount)+' грн</div><div class="pc-bnk">'+p.bank+"</div>";
    top.appendChild(inf);top.appendChild(rgt);card.appendChild(top);

    var purp=el("div","purp");
    purp.innerHTML='<div class="purp-lb">Призначення платежу</div><div class="purp-tx">'+p.purpose+"</div>";
    card.appendChild(purp);

    if(lim){
      var limw=el("div","limw");
      limw.innerHTML='<div class="limb"><div class="limf" style="width:'+pct+'%;background:'+lc+'"></div></div><div class="limm"><span>'+fmtN(spent)+' грн використано</span><span>Ліміт: '+fmtN(lim)+' грн ('+pct+'%)</span></div>';
      card.appendChild(limw);
    }

    var pac=el("div","pac");
    function mkBtn(label, icon, fn){
      var b=el("button","btn xs");b.innerHTML='<i class="ti '+icon+'"></i> '+label;
      b.addEventListener("click",fn);return b;
    }
    pac.appendChild(mkBtn("Призначення","ti-copy",function(){copyTxt(p.purpose);}));
    pac.appendChild(mkBtn("IBAN","ti-copy",function(){copyTxt(p.iban);}));
    pac.appendChild(mkBtn("Сума","ti-copy",function(){copyTxt(String(p.amount));}));
    pac.appendChild(mkBtn("Весь блок","ti-clipboard-list",function(){
      copyTxt("Отримувач: "+p.counterparty+"\nIBAN: "+p.iban+"\nБанк: "+p.bank+"\nСума: "+fmtN(p.amount)+" грн\nПризначення: "+p.purpose);
    }));
    var sep=el("div","sep");pac.appendChild(sep);
    pac.appendChild(mkBtn("Редагувати","ti-edit",function(){
      S.editId=p.id;S.form=Object.assign({},p,{fmt:"ДДММРР/XXX"});S.page="edit";render();
    }));
    pac.appendChild(mkBtn("Статус","ti-refresh",function(){S.modal={type:"status",payId:p.id};render();}));
    if(!p.docsChecked){
      pac.appendChild(mkBtn("Перевірено","ti-check",function(){
        p.docsChecked=true;addAudit("Документи перевірено","Рахунок "+p.invoiceNumber);saveData();render();toast("Позначено");
      }));
    }
    var sep2=el("div","sep");pac.appendChild(sep2);
    var delbtn=el("button","btn xs del");delbtn.innerHTML='<i class="ti ti-trash"></i> Видалити';
    delbtn.addEventListener("click",function(){S.modal={type:"delete",payId:p.id};render();});
    pac.appendChild(delbtn);
    card.appendChild(pac);
    list.appendChild(card);
  });
  el_.appendChild(list);
}

function doSave(){
  var f=S.form;
  if(!f.counterparty||!f.invoiceDate||!f.invoiceNumber||!f.amount){toast("Заповніть усі поля (*)");return;}
  if(isWE(f.invoiceDate)){toast("Оберіть робочий день");return;}
  if(f.invoiceDate>today()){toast("Дата не може бути в майбутньому");return;}
  var dups=checkDups(f);
  if(dups.length&&!S.dupOk){S.modal={type:"dup",warns:dups};render();return;}
  S.dupOk=false;
  var cp=DATA.counterparties.filter(function(c){return c.name===f.counterparty;})[0];
  if(S.editId){
    var idx=DATA.payments.findIndex(function(p){return p.id===S.editId;});
    if(idx>=0){DATA.payments[idx]=Object.assign({},DATA.payments[idx],f,{id:S.editId,amount:Number(f.amount)});}
    addAudit("Редаговано платіж","Рахунок "+f.invoiceNumber);
  } else {
    DATA.payments.push({id:DATA.nextId++, createdAt:today(), invoiceDate:f.invoiceDate, invoiceNumber:f.invoiceNumber, counterparty:f.counterparty, edrpou:cp?cp.edrpou:"", iban:cp?cp.iban:"", bank:cp?cp.bank:"", amount:Number(f.amount), serviceType:f.serviceType, purpose:f.purpose||buildPurpose(f.serviceType,f.invoiceNumber,f.invoiceDate,cp&&cp.template), createdBy:DATA.user.name, status:f.status||"draft", docsChecked:false});
    addAudit("Створено платіж","Рахунок "+f.invoiceNumber+" · "+f.counterparty+" · "+fmtN(Number(f.amount))+" грн");
  }
  S.page="payments";S.editId=null;S.form={};S.modal=null;render();toast("Збережено");
}

/* ===================== COUNTERPARTIES ===================== */
function pCP(el_){
  var bar=el("div");bar.style.cssText="display:flex;justify-content:flex-end;margin-bottom:18px";
  var abtn=el("button","btn pr");abtn.innerHTML='<i class="ti ti-plus"></i> Додати контрагента';
  abtn.addEventListener("click",function(){S.modal={type:"cp",data:{active:true,monthLimit:50000}};render();});
  bar.appendChild(abtn);el_.appendChild(bar);

  var grid=el("div","cpgrid");
  DATA.counterparties.forEach(function(c){
    var iok=validIBAN(c.iban);
    var spent=monthSpend(c.name,today().slice(0,7));
    var pct=c.monthLimit?Math.min(100,Math.round(spent/c.monthLimit*100)):0;
    var lc=pct>90?"#E24B4A":pct>70?"#EF9F27":"#639922";

    var card=el("div","cpcard");
    var hd=el("div","cph");
    hd.innerHTML='<div class="cpav">'+initials(c.name)+'</div><div style="flex:1;min-width:0"><div class="cpnm">'+c.name+' <span class="bdg '+(c.active?"paid":"draft")+'" style="font-size:10px">'+(c.active?"Активний":"Неактивний")+'</span></div><div class="cpid">'+c.edrpou+" · "+c.bank+"</div></div>";
    card.appendChild(hd);

    var r1=el("div","cprow");r1.innerHTML='<span class="cprl">IBAN</span><span class="cprv" style="color:'+(iok?"var(--gdk)":"var(--rdk)")+'">'+( iok?"✓ ":"")+c.iban.slice(0,12)+"…</span>";card.appendChild(r1);
    var r2=el("div","cprow");r2.innerHTML='<span class="cprl">Тип послуг</span><span style="font-size:12px">'+c.serviceType+"</span>";card.appendChild(r2);

    if(c.monthLimit){
      var lr=el("div","cprow");lr.style.cssText="flex-direction:column;align-items:stretch;gap:5px";
      lr.innerHTML='<span class="cprl">Ліміт: '+fmtN(c.monthLimit)+' грн/міс</span><div class="limb"><div class="limf" style="width:'+pct+'%;background:'+lc+'"></div></div><div class="limm"><span>'+fmtN(spent)+" використано</span><span>"+pct+"%</span></div>";
      card.appendChild(lr);
    }

    var ac=el("div","cpac");
    var eb=el("button","btn sm");eb.innerHTML='<i class="ti ti-edit"></i> Редагувати';
    eb.addEventListener("click",(function(cc){return function(){S.modal={type:"cp",data:Object.assign({},cc)};render();};})(c));
    var tb2=el("button","btn sm");tb2.innerHTML=c.active?'<i class="ti ti-eye-off"></i> Деактивувати':'<i class="ti ti-eye"></i> Активувати';
    tb2.addEventListener("click",(function(cc){return function(){cc.active=!cc.active;addAudit(cc.active?"Активовано":"Деактивовано",cc.name);saveData();render();};})(c));
    var db=el("button","btn sm del");db.innerHTML='<i class="ti ti-trash"></i>';
    db.addEventListener("click",(function(cc){return function(){
      if(!confirm("Видалити контрагента "+cc.name+"?")) return;
      var i=DATA.counterparties.indexOf(cc);if(i>=0){addAudit("Видалено контрагента",cc.name);DATA.counterparties.splice(i,1);}
      render();toast("Видалено");
    };})(c));
    ac.appendChild(eb);ac.appendChild(tb2);ac.appendChild(db);
    card.appendChild(ac);
    grid.appendChild(card);
  });
  el_.appendChild(grid);
}

/* counterparty modal save */
function saveCPModal(){
  var n=document.getElementById("cpn").value.trim();
  var e=document.getElementById("cpe").value.trim();
  var ib=document.getElementById("cpi").value.trim();
  var b=document.getElementById("cpb").value.trim();
  var ss=document.getElementById("cps").value;
  var l=Number(document.getElementById("cpl").value)||0;
  var a=document.getElementById("cpa").value==="true";
  var t=document.getElementById("cpt").value.trim();
  if(!n){toast("Введіть назву");return;}
  if(!e){toast("Введіть ЄДРПОУ");return;}
  if(!ib){toast("Введіть IBAN");return;}
  var d=S.modal.data;
  if(d.id){
    var idx=DATA.counterparties.findIndex(function(c){return c.id===d.id;});
    if(idx>=0) DATA.counterparties[idx]=Object.assign({},DATA.counterparties[idx],{name:n,edrpou:e,iban:ib,bank:b,serviceType:ss,monthLimit:l,active:a,template:t});
    addAudit("Редаговано контрагента",n);
  } else {
    DATA.counterparties.push({id:Date.now(),name:n,edrpou:e,iban:ib,bank:b,serviceType:ss,monthLimit:l,active:a,template:t});
    addAudit("Додано контрагента",n);
  }
  S.modal=null;render();toast("Контрагента збережено");
}

/* ===================== DASHBOARD ===================== */
function pDash(el_){
  var thisM=today().slice(0,7);
  var active=DATA.payments.filter(function(p){return p.status!=="cancelled";});
  var paidAmt=active.filter(function(p){return p.status==="paid";}).reduce(function(s,p){return s+Number(p.amount);},0);
  var total=active.reduce(function(s,p){return s+Number(p.amount);},0);

  var mg=el("div","mrow");
  [{cls:"bl",icon:"ti-credit-card",label:"Оплачено",val:fmtN(paidAmt)+" грн",sub:active.filter(function(p){return p.status==="paid";}).length+" платежів"},
   {cls:"gr",icon:"ti-cash",label:"Загальна сума",val:fmtN(total)+" грн",sub:"без скасованих"},
   {cls:"am",icon:"ti-users",label:"Контрагентів",val:DATA.counterparties.filter(function(c){return c.active;}).length,sub:"активних"},
   {cls:"rd",icon:"ti-file-alert",label:"Чернеток",val:DATA.payments.filter(function(p){return p.status==="draft";}).length,sub:"очікують обробки"}
  ].forEach(function(m){
    var d=el("div","mc "+m.cls);d.innerHTML='<div class="mc-ic"><i class="ti '+m.icon+'"></i></div><div class="mc-lb">'+m.label+"</div><div class=\"mc-vl\">"+m.val+"</div><div class=\"mc-sb\">"+m.sub+"</div>";mg.appendChild(d);
  });
  el_.appendChild(mg);

  var dgrid=el("div","dgrid");

  // by counterparty
  var maxCp=0;DATA.counterparties.forEach(function(c){var s=monthSpend(c.name,thisM);if(s>maxCp)maxCp=s;});if(!maxCp)maxCp=1;
  var cpCard=el("div","dc");cpCard.innerHTML='<div class="dct"><i class="ti ti-building-community"></i>Витрати по контрагентах (місяць)</div>';
  DATA.counterparties.forEach(function(c){
    var s=monthSpend(c.name,thisM);var pct=Math.round(s/maxCp*100);
    var r=el("div","br");r.innerHTML='<div class="brl" title="'+c.name+'">'+c.name.split(" ").slice(0,2).join(" ")+'</div><div class="brt"><div class="brf" style="width:'+pct+'%;background:#378ADD"></div></div><div class="brv">'+fmtN(s)+"</div>";
    cpCard.appendChild(r);
  });
  dgrid.appendChild(cpCard);

  // by service type
  var svcT={};active.forEach(function(p){svcT[p.serviceType]=(svcT[p.serviceType]||0)+Number(p.amount);});
  var maxS=0;Object.keys(svcT).forEach(function(k){if(svcT[k]>maxS)maxS=svcT[k];});if(!maxS)maxS=1;
  var svcCard=el("div","dc");svcCard.innerHTML='<div class="dct"><i class="ti ti-briefcase"></i>По типах послуг</div>';
  Object.keys(svcT).sort(function(a,b){return svcT[b]-svcT[a];}).forEach(function(t){
    var pct=Math.round(svcT[t]/maxS*100);
    var r=el("div","br");r.innerHTML='<div class="brl" title="'+t+'">'+t.split(" ")[0]+'</div><div class="brt"><div class="brf" style="width:'+pct+'%;background:#1D9E75"></div></div><div class="brv">'+fmtN(svcT[t])+"</div>";
    svcCard.appendChild(r);
  });
  dgrid.appendChild(svcCard);

  // status summary
  var sc=el("div","dc full");sc.innerHTML='<div class="dct"><i class="ti ti-chart-bar"></i>Статуси платежів</div><div class="sgrid">'+Object.keys(STAT).map(function(k){var cnt=DATA.payments.filter(function(p){return p.status===k;}).length;var amt=DATA.payments.filter(function(p){return p.status===k;}).reduce(function(s,p){return s+Number(p.amount);},0);return '<div class="si"><div class="sil">'+STAT[k]+'</div><div class="siv">'+cnt+'</div><div class="sis">'+fmtN(amt)+' грн</div></div>';}).join("")+"</div>";
  dgrid.appendChild(sc);
  el_.appendChild(dgrid);
}

/* ===================== AUDIT ===================== */
function pAudit(el_){
  var card=el("div","fcard");card.innerHTML='<div class="fct"><i class="ti ti-history"></i>Журнал змін ('+DATA.audit.length+")</div>";
  var list=el("div","aulist");
  if(!DATA.audit.length){var em=el("div");em.style.cssText="padding:30px;color:var(--tx2);text-align:center";em.textContent="Журнал порожній";list.appendChild(em);}
  DATA.audit.forEach(function(a){
    var it=el("div","auit");
    it.innerHTML='<div class="audot"></div><div class="auts">'+a.ts+'</div><div style="flex:1"><div class="auac">'+a.action+'</div><div class="aude">'+a.detail+' · <span style="color:var(--tx3)">'+a.user+"</span></div></div>";
    list.appendChild(it);
  });
  card.appendChild(list);el_.appendChild(card);
}

/* ===================== EXPORT ===================== */
function pExport(el_){
  var card=el("div","fcard");
  card.innerHTML='<div class="fct"><i class="ti ti-download"></i>Завантажити дані</div><p style="font-size:13px;color:var(--tx2);margin-bottom:20px">Оберіть формат для експорту всіх платежів</p>';
  var grid=el("div","exgrid");
  [{cls:"xl",icon:"ti-file-spreadsheet",label:"Excel",sub:".xlsx",fn:function(){doExport("xlsx");}},
   {cls:"csv",icon:"ti-file-text",label:"CSV",sub:"Текстовий файл",fn:function(){doExport("csv");}},
   {cls:"pr",icon:"ti-printer",label:"Друк / PDF",sub:"Роздруківка",fn:function(){window.print();}}
  ].forEach(function(ex){
    var d=el("div","excard "+ex.cls);
    d.innerHTML='<i class="ti '+ex.icon+'"></i><div class="exct">'+ex.label+'</div><div class="excs">'+ex.sub+"</div>";
    d.addEventListener("click",ex.fn);grid.appendChild(d);
  });
  card.appendChild(grid);el_.appendChild(card);

  // Backup section
  var bcard=el("div","fcard");bcard.style.marginTop="16px";
  bcard.innerHTML='<div class="fct"><i class="ti ti-database"></i>Резервна копія (localStorage)</div><p style="font-size:13px;color:var(--tx2);margin-bottom:16px">Дані зберігаються локально у вашому браузері. Зробіть резервну копію перед очищенням.</p>';
  var bgrid=el("div");bgrid.style.cssText="display:flex;gap:10px;flex-wrap:wrap";

  var bb1=el("button","btn pr");bb1.innerHTML='<i class="ti ti-download"></i> Завантажити резервну копію JSON';
  bb1.addEventListener("click",exportBackup);bgrid.appendChild(bb1);

  var bb2=el("button","btn");bb2.innerHTML='<i class="ti ti-upload"></i> Імпортувати резервну копію JSON';
  bb2.addEventListener("click",function(){
    var inp=document.createElement("input");inp.type="file";inp.accept=".json";
    inp.addEventListener("change",function(){importBackup(this.files[0]);});
    inp.click();
  });bgrid.appendChild(bb2);

  var bb3=el("button","btn del");bb3.innerHTML='<i class="ti ti-trash"></i> Очистити локальні дані';
  bb3.addEventListener("click",resetData);bgrid.appendChild(bb3);

  var lsinfo=el("div");lsinfo.style.cssText="margin-top:14px;padding:10px 14px;background:var(--sur2);border-radius:var(--r);font-size:12px;color:var(--tx2)";
  var lsBytes=0;try{var raw=localStorage.getItem(LS_KEY);lsBytes=raw?new Blob([raw]).size:0;}catch(e){}
  lsinfo.innerHTML='<i class="ti ti-info-circle"></i> Збережено у localStorage: <b>'+(lsBytes>0?(Math.round(lsBytes/1024*10)/10)+" КБ":"немає даних")+'</b> &nbsp;|&nbsp; Платежів: <b>'+DATA.payments.length+'</b> &nbsp;|&nbsp; Контрагентів: <b>'+DATA.counterparties.length+'</b>';

  bcard.appendChild(bgrid);bcard.appendChild(lsinfo);el_.appendChild(bcard);
}

function doExport(type){
  var rows=DATA.payments.map(function(p){return {"Дата":fmtD(p.invoiceDate),"Номер рахунку":p.invoiceNumber,"Контрагент":p.counterparty,"ЄДРПОУ":p.edrpou,"IBAN":p.iban,"Банк":p.bank,"Сума":p.amount,"Тип послуг":p.serviceType,"Призначення":p.purpose,"Статус":STAT[p.status],"Створив":p.createdBy};});
  if(type==="csv"){
    var hs=Object.keys(rows[0]||{});
    var csv=[hs.join(";")].concat(rows.map(function(r){return hs.map(function(h){return '"'+String(r[h]||"").replace(/"/g,'""')+'"';}).join(";");})).join("\r\n");
    var a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"}));a.download="payments.csv";a.click();
  } else if(type==="xlsx"&&window.XLSX){
    var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),"Платежі");XLSX.writeFile(wb,"payments.xlsx");
  } else {toast("Завантаження...");}
}

/* ===================== MODALS ===================== */
function renderModal(){
  var m=S.modal;
  var ov=document.createElement("div");ov.className="mov";
  ov.addEventListener("click",function(e){if(e.target===ov){S.modal=null;render();}});

  if(m.type==="status"){
    var p=DATA.payments.filter(function(x){return x.id===m.payId;})[0];
    var mo=el("div","mo");
    mo.innerHTML='<div class="moh"><span class="moht">Змінити статус</span><button class="btn gh" id="mc-x"><i class="ti ti-x"></i></button></div><div class="mob"><div class="fg"><label>Новий статус</label><select id="ms">'+Object.keys(STAT).map(function(k){return '<option value="'+k+'"'+(p.status===k?" selected":"")+">"+STAT[k]+"</option>";}).join("")+'</select></div></div><div class="mof"><button class="btn pr" id="ms-ok"><i class="ti ti-check"></i> Застосувати</button><button class="btn" id="ms-cn">Скасувати</button></div>';
    ov.appendChild(mo);document.body.appendChild(ov);
    document.getElementById("mc-x").addEventListener("click",function(){S.modal=null;render();});
    document.getElementById("ms-cn").addEventListener("click",function(){S.modal=null;render();});
    document.getElementById("ms-ok").addEventListener("click",function(){
      var sel=document.getElementById("ms");
      if(p&&sel){var old=p.status;p.status=sel.value;addAudit("Статус змінено","Рахунок "+p.invoiceNumber+": "+STAT[old]+" → "+STAT[p.status]);}
      saveData();S.modal=null;render();toast("Статус оновлено");
    });

  } else if(m.type==="dup"){
    var mo2=el("div","mo");
    mo2.innerHTML='<div class="moh"><span class="moht">Виявлено дублювання</span></div><div class="mob">'+m.warns.map(function(w){return '<div class="al warn" style="margin-bottom:8px"><i class="ti ti-alert-triangle"></i>'+w+"</div>";}).join("")+'<p style="font-size:13px;color:var(--tx2);margin-top:12px">Все одно зберегти?</p></div><div class="mof"><button class="btn del" id="dp-ok"><i class="ti ti-alert-triangle"></i> Так, зберегти</button><button class="btn pr" id="dp-cn">Скасувати</button></div>';
    ov.appendChild(mo2);document.body.appendChild(ov);
    document.getElementById("dp-ok").addEventListener("click",function(){S.dupOk=true;S.modal=null;doSave();});
    document.getElementById("dp-cn").addEventListener("click",function(){S.modal=null;render();});

  } else if(m.type==="delete"){
    var p2=DATA.payments.filter(function(x){return x.id===m.payId;})[0];
    var mo3=el("div","mo");
    mo3.innerHTML='<div class="moh"><span class="moht">Видалити платіж</span></div><div class="mob"><div class="al err"><i class="ti ti-alert-triangle"></i><div>Видалити платіж?<br><br><b>'+(p2?p2.invoiceNumber:"")+"</b> · "+(p2?p2.counterparty:"")+" · "+(p2?fmtN(p2.amount):"")+'<br><br>Цю дію не можна скасувати.</div></div></div><div class="mof"><button class="btn del" id="dl-ok"><i class="ti ti-trash"></i> Видалити</button><button class="btn pr" id="dl-cn">Скасувати</button></div>';
    ov.appendChild(mo3);document.body.appendChild(ov);
    document.getElementById("dl-ok").addEventListener("click",function(){
      var idx=DATA.payments.findIndex(function(x){return x.id===m.payId;});
      if(idx>=0){addAudit("Видалено платіж","Рахунок "+DATA.payments[idx].invoiceNumber);DATA.payments.splice(idx,1);}
      saveData();S.modal=null;render();toast("Платіж видалено");
    });
    document.getElementById("dl-cn").addEventListener("click",function(){S.modal=null;render();});

  } else if(m.type==="cp"){
    var d=m.data;var iok2=d.iban?validIBAN(d.iban):null;
    var mo4=el("div","mo");
    mo4.innerHTML='<div class="moh"><span class="moht">'+(d.id?"Редагувати":"Додати")+' контрагента</span><button class="btn gh" id="cp-x"><i class="ti ti-x"></i></button></div><div class="mob"><div class="g2" style="gap:12px"><div class="fg full"><label>Назва *</label><input type="text" id="cpn" value="'+(d.name||"")+'" placeholder="ФОП Прізвище або ТОВ Назва"></div><div class="fg"><label>ЄДРПОУ / ІПН *</label><input type="text" id="cpe" value="'+(d.edrpou||"")+'" placeholder="12345678"></div><div class="fg"><label>Банк</label><input type="text" id="cpb" value="'+(d.bank||"")+'" placeholder="ПриватБанк"></div><div class="fg full"><label>IBAN *</label><input type="text" id="cpi" value="'+(d.iban||"")+'" placeholder="UA213223130000026007233566001"><div id="iban-hint" style="font-size:11px;font-weight:500;margin-top:4px;color:'+(iok2===null?"transparent":iok2?"var(--gdk)":"var(--rdk)")+'">'+(d.iban?(iok2?"✓ IBAN валідний":"✗ Невірний формат"):".")+'</div></div><div class="fg full"><label>Тип послуг</label><select id="cps">'+SVC.map(function(s){return '<option value="'+s+'"'+(d.serviceType===s?" selected":"")+">"+s+"</option>";}).join("")+'</select></div><div class="fg"><label>Ліміт грн/міс</label><input type="number" id="cpl" value="'+(d.monthLimit||"")+'" placeholder="50000"></div><div class="fg"><label>Статус</label><select id="cpa"><option value="true"'+(d.active?" selected":"")+'>Активний</option><option value="false"'+(!d.active?" selected":"")+'>Неактивний</option></select></div><div class="fg full"><label>Шаблон призначення</label><input type="text" id="cpt" value="'+(d.template||"")+'" placeholder="Оплата {тип} згідно рахунку {номер} від {дата}"></div></div></div><div class="mof"><button class="btn pr" id="cp-sv"><i class="ti ti-check"></i> Зберегти</button><button class="btn" id="cp-cn">Скасувати</button></div>';
    ov.appendChild(mo4);document.body.appendChild(ov);
    document.getElementById("cp-x").addEventListener("click",function(){S.modal=null;render();});
    document.getElementById("cp-cn").addEventListener("click",function(){S.modal=null;render();});
    document.getElementById("cp-sv").addEventListener("click",saveCPModal);
    document.getElementById("cpi").addEventListener("input",function(){
      var ok=validIBAN(this.value);
      var hint=document.getElementById("iban-hint");
      if(hint){hint.style.color=ok?"var(--gdk)":"var(--rdk)";hint.textContent=this.value?(ok?"✓ IBAN валідний":"✗ Невірний формат"):".";}
    });
  }
}

loadData();
render();
